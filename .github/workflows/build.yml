          @Composable
          private fun SuggestionList(vm: MainViewModel) {
              LazyColumn(Modifier.fillMaxSize()) {
                  items(if (vm.searchText.isBlank()) vm.searchHistory else vm.suggestions) { s ->
                      Row(
                          Modifier
                              .fillMaxWidth()
                              .clickable { vm.submitSearch(s) }
                              .padding(horizontal = 16.dp, vertical = 14.dp),
                          verticalAlignment = Alignment.CenterVertically
                      ) {
                          Icon(
                              Icons.Filled.Search, null,
                              Modifier.size(20.dp),
                              tint = MaterialTheme.colorScheme.onSurfaceVariant
                          )
                          Spacer(Modifier.width(16.dp))
                          Text(s, fontSize = 16.sp)
                      }
                  }
              }
          }

          @Composable
          private fun Chips(vm: MainViewModel) {
              LazyRow(
                  contentPadding = PaddingValues(horizontal = 12.dp, vertical = 8.dp),
                  horizontalArrangement = Arrangement.spacedBy(8.dp)
              ) {
                  if (vm.googleSignedIn) {
                      item { ChipItem("Đăng ký", vm.subsMode) { vm.openSubscriptions() } }
                  }
                  itemsIndexed(vm.chips) { i, chip ->
                      ChipItem(chip.first, !vm.subsMode && vm.selectedChip == i) { vm.selectChip(i) }
                  }
              }
          }

          @Composable
          private fun ChipItem(label: String, selected: Boolean, onClick: () -> Unit) {
              val colors = MaterialTheme.colorScheme
              Text(
                  label,
                  color = if (selected) colors.background else colors.onBackground,
                  fontSize = 14.sp,
                  fontWeight = FontWeight.Medium,
                  modifier = Modifier
                      .clip(RoundedCornerShape(8.dp))
                      .background(if (selected) colors.onBackground else colors.surfaceVariant)
                      .clickable(onClick = onClick)
                      .padding(horizontal = 12.dp, vertical = 7.dp)
              )
          }

          @Composable
          private fun SubsFeed(vm: MainViewModel) {
              Box(Modifier.fillMaxSize()) {
                  LazyColumn(modifier = Modifier.fillMaxSize()) {
                      items(vm.subsFeed) { v ->
                          FeedCard(v) { vm.play(v.url, v.title) }
                      }
                  }
                  if (vm.subsLoading) {
                      CircularProgressIndicator(Modifier.align(Alignment.Center))
                  }
                  vm.subsError?.let { msg ->
                      ErrorBox(msg) { vm.openSubscriptions() }
                  }
                  if (!vm.subsLoading && vm.subsError == null && vm.subsFeed.isEmpty()) {
                      Text(
                          "Chưa có video mới từ các kênh bạn đã đăng ký",
                          color = MaterialTheme.colorScheme.onSurfaceVariant,
                          modifier = Modifier
                              .align(Alignment.Center)
                              .padding(24.dp)
                      )
                  }
              }
          }

          @Composable
          private fun Feed(vm: MainViewModel) {
              val listState = vm.feedListState
              val nearEnd by remember {
                  derivedStateOf {
                      val info = listState.layoutInfo
                      val last = info.visibleItemsInfo.lastOrNull()?.index ?: -1
                      info.totalItemsCount > 0 && last >= info.totalItemsCount - 3
                  }
              }
              LaunchedEffect(nearEnd, vm.feed.size) {
                  if (nearEnd) vm.loadMore()
              }

              Box(Modifier.fillMaxSize()) {
                  LazyColumn(modifier = Modifier.fillMaxSize(), state = listState) {
                      items(vm.feed) { item ->
                          VideoCard(item) { vm.play(item.url, item.name) }
                      }
                      if (vm.moreLoading) {
                          item {
                              Box(
                                  Modifier
                                      .fillMaxWidth()
                                      .padding(16.dp),
                                  contentAlignment = Alignment.Center
                              ) { CircularProgressIndicator(Modifier.size(24.dp)) }
                          }
                      }
                  }
                  if (vm.feedLoading) {
                      CircularProgressIndicator(Modifier.align(Alignment.Center))
                  }
                  vm.feedError?.let { msg ->
                      ErrorBox(msg) { vm.loadFeed(vm.currentQuery) }
                  }
              }
          }
