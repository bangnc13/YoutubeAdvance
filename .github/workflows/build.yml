          @Composable
          fun HomeScreen(vm: MainViewModel) {
              Column(Modifier.fillMaxSize()) {
                  if (vm.searching) {
                      SearchTopBar(vm)
                      SuggestionList(vm)
                  } else {
                      HomeTopBar(vm)
                      Chips(vm)
                      Feed(vm)
                  }
              }
          }

          @Composable
          private fun HomeTopBar(vm: MainViewModel) {
              Row(
                  Modifier
                      .fillMaxWidth()
                      .height(56.dp)
                      .padding(horizontal = 12.dp),
                  verticalAlignment = Alignment.CenterVertically
              ) {
                  YouTubeLogo()
                  Spacer(Modifier.weight(1f))
                  IconButton(onClick = { vm.openSearch() }) {
                      Icon(Icons.Filled.Search, contentDescription = "Tìm kiếm")
                  }
                  IconButton(onClick = { vm.showProfile = true }) {
                      if (vm.userKey != null) {
                          InitialBadge(vm.userName, 28.dp)
                      } else {
                          Icon(Icons.Filled.AccountCircle, contentDescription = "Tài khoản")
                      }
                  }
              }
          }

          @Composable
          private fun SearchTopBar(vm: MainViewModel) {
              val focus = remember { FocusRequester() }
              val focusManager = LocalFocusManager.current
              LaunchedEffect(Unit) { focus.requestFocus() }

              Row(
                  Modifier
                      .fillMaxWidth()
                      .padding(horizontal = 4.dp, vertical = 4.dp),
                  verticalAlignment = Alignment.CenterVertically
              ) {
                  IconButton(onClick = { vm.searching = false }) {
                      Icon(Icons.AutoMirrored.Filled.ArrowBack, contentDescription = "Quay lại")
                  }
                  TextField(
                      value = vm.searchText,
                      onValueChange = { vm.onSearchTextChange(it) },
                      placeholder = { Text("Tìm kiếm") },
                      singleLine = true,
                      shape = RoundedCornerShape(24.dp),
                      colors = TextFieldDefaults.colors(
                          focusedIndicatorColor = Color.Transparent,
                          unfocusedIndicatorColor = Color.Transparent,
                          disabledIndicatorColor = Color.Transparent,
                          focusedContainerColor = MaterialTheme.colorScheme.surfaceVariant,
                          unfocusedContainerColor = MaterialTheme.colorScheme.surfaceVariant
                      ),
                      keyboardOptions = KeyboardOptions(imeAction = ImeAction.Search),
                      keyboardActions = KeyboardActions(onSearch = {
                          focusManager.clearFocus()
                          vm.submitSearch(vm.searchText)
                      }),
                      trailingIcon = {
                          if (vm.searchText.isNotEmpty()) {
                              IconButton(onClick = { vm.onSearchTextChange("") }) {
                                  Icon(Icons.Filled.Close, contentDescription = "Xóa")
                              }
                          }
                      },
                      modifier = Modifier
                          .weight(1f)
                          .focusRequester(focus)
                  )
                  Spacer(Modifier.width(8.dp))
              }
          }

          @Composable
          private fun SuggestionList(vm: MainViewModel) {
              LazyColumn(Modifier.fillMaxSize()) {
                  items(if (vm.searchText.isBlank()) vm.searchHistory else vm.suggestions) { s ->
                      Row(
                          Modifier
                              .fillMaxWidth()
                              .clickable { vm.submitSearch(s) }
                              .padding(horizontal = 16.dp, vertical = 14.dp),
                          verticalAlignment = Alignment.CenterVertically
                      ) {
                          Icon(
                              Icons.Filled.Search, null,
                              Modifier.size(20.dp),
                              tint = MaterialTheme.colorScheme.onSurfaceVariant
                          )
                          Spacer(Modifier.width(16.dp))
                          Text(s, fontSize = 16.sp)
                      }
                  }
              }
          }

          @Composable
          private fun Chips(vm: MainViewModel) {
              LazyRow(
                  contentPadding = PaddingValues(horizontal = 12.dp, vertical = 8.dp),
                  horizontalArrangement = Arrangement.spacedBy(8.dp)
              ) {
                  itemsIndexed(vm.chips) { i, chip ->
                      val selected = vm.selectedChip == i
                      val colors = MaterialTheme.colorScheme
                      Text(
                          chip.first,
                          color = if (selected) colors.background else colors.onBackground,
                          fontSize = 14.sp,
                          fontWeight = FontWeight.Medium,
                          modifier = Modifier
                              .clip(RoundedCornerShape(8.dp))
                              .background(if (selected) colors.onBackground else colors.surfaceVariant)
                              .clickable { vm.selectChip(i) }
                              .padding(horizontal = 12.dp, vertical = 7.dp)
                      )
                  }
              }
          }

          @Composable
          private fun Feed(vm: MainViewModel) {
              val listState = vm.feedListState
              val nearEnd by remember {
                  derivedStateOf {
                      val info = listState.layoutInfo
                      val last = info.visibleItemsInfo.lastOrNull()?.index ?: -1
                      info.totalItemsCount > 0 && last >= info.totalItemsCount - 3
                  }
              }
              LaunchedEffect(nearEnd, vm.feed.size) {
                  if (nearEnd) vm.loadMore()
              }

              Box(Modifier.fillMaxSize()) {
                  LazyColumn(modifier = Modifier.fillMaxSize(), state = listState) {
                      items(vm.feed) { item ->
                          VideoCard(item) { vm.play(item.url, item.name) }
                      }
                      if (vm.moreLoading) {
                          item {
                              Box(
                                  Modifier
                                      .fillMaxWidth()
                                      .padding(16.dp),
                                  contentAlignment = Alignment.Center
                              ) { CircularProgressIndicator(Modifier.size(24.dp)) }
                          }
                      }
                  }
                  if (vm.feedLoading) {
                      CircularProgressIndicator(Modifier.align(Alignment.Center))
                  }
                  vm.feedError?.let { msg ->
                      ErrorBox(msg) { vm.loadFeed(vm.currentQuery) }
                  }
              }
          }
