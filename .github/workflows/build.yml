          package com.example.adfreetube

          import android.content.Intent
          import androidx.media3.common.AudioAttributes
          import androidx.media3.common.C
          import androidx.media3.datasource.DefaultHttpDataSource
          import androidx.media3.datasource.ResolvingDataSource
          import androidx.media3.exoplayer.ExoPlayer
          import androidx.media3.exoplayer.source.DefaultMediaSourceFactory
          import androidx.media3.session.MediaSession
          import androidx.media3.session.MediaSessionService

          /**
           * Trình phát chạy trong một dịch vụ nền (foreground service) nên tắt màn hình
           * hoặc thoát app vẫn tiếp tục phát, có thông báo điều khiển trên màn hình khóa.
           */
          class PlaybackService : MediaSessionService() {
              private var session: MediaSession? = null

              override fun onCreate() {
                  super.onCreate()

                  // Mỗi link stream cần đúng User-Agent của "client" YouTube tạo ra nó
                  val http = DefaultHttpDataSource.Factory().setAllowCrossProtocolRedirects(true)
                  val dataSource = ResolvingDataSource.Factory(http) { spec ->
                      spec.withAdditionalHeaders(mapOf("User-Agent" to userAgentFor(spec.uri.toString())))
                  }

                  val player = ExoPlayer.Builder(this)
                      .setMediaSourceFactory(DefaultMediaSourceFactory(dataSource))
                      .setAudioAttributes(AudioAttributes.DEFAULT, true)
                      .setHandleAudioBecomingNoisy(true)
                      .setWakeMode(C.WAKE_MODE_NETWORK)
                      .build()

                  session = MediaSession.Builder(this, player).build()
              }

              override fun onGetSession(controllerInfo: MediaSession.ControllerInfo): MediaSession? = session

              // Vuốt app khỏi danh sách gần đây thì dừng hẳn
              override fun onTaskRemoved(rootIntent: Intent?) {
                  session?.player?.pause()
                  stopSelf()
              }

              override fun onDestroy() {
                  session?.run {
                      player.release()
                      release()
                  }
                  session = null
                  super.onDestroy()
              }
          }
