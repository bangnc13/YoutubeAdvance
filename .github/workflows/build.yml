          package com.example.adfreetube

          import android.app.Application
          import android.content.ComponentName
          import androidx.compose.foundation.lazy.LazyListState
          import androidx.compose.runtime.getValue
          import androidx.compose.runtime.mutableIntStateOf
          import androidx.compose.runtime.mutableStateOf
          import androidx.compose.runtime.setValue
          import androidx.core.content.ContextCompat
          import androidx.core.text.HtmlCompat
          import androidx.lifecycle.AndroidViewModel
          import androidx.media3.common.PlaybackException
          import androidx.media3.common.Player
          import androidx.media3.session.MediaController
          import androidx.media3.session.SessionToken
          import androidx.lifecycle.viewModelScope
          import kotlinx.coroutines.CancellationException
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.Job
          import kotlinx.coroutines.delay
          import kotlinx.coroutines.launch
          import kotlinx.coroutines.withContext
          import org.schabi.newpipe.extractor.NewPipe
          import org.schabi.newpipe.extractor.Page
          import org.schabi.newpipe.extractor.ServiceList
          import org.schabi.newpipe.extractor.linkhandler.SearchQueryHandler
          import org.schabi.newpipe.extractor.localization.ContentCountry
          import org.schabi.newpipe.extractor.localization.Localization
          import org.schabi.newpipe.extractor.search.SearchInfo
          import org.schabi.newpipe.extractor.stream.Description
          import org.schabi.newpipe.extractor.stream.StreamInfo
          import org.schabi.newpipe.extractor.stream.StreamInfoItem

          data class Quality(val label: String, val url: String)

          data class WatchState(
              val pageUrl: String,
              val title: String,
              val uploader: String,
              val avatar: String?,
              val subscribers: Long,
              val views: Long,
              val likes: Long,
              val date: String,
              val description: String,
              val thumb: String?,
              val duration: Long,
              val qualities: List<Quality>,
              val related: List<StreamInfoItem>
          )

          class MainViewModel(app: Application) : AndroidViewModel(app) {
              private val youtube = ServiceList.YouTube
              private val store = UserStore(app)

              // ---- Tài khoản cục bộ ----
              var showProfile by mutableStateOf(false)
              var userKey by mutableStateOf<String?>(store.currentUser())
              var userName by mutableStateOf(store.currentUser()?.let { store.displayName(it) } ?: "")
              var loginError by mutableStateOf<String?>(null)
              var history by mutableStateOf<List<HistoryEntry>>(emptyList())
              var searchHistory by mutableStateOf<List<String>>(emptyList())

              // ---- Trang chủ / tìm kiếm ----
              val chips = listOf(
                  "Tất cả" to "xu hướng",
                  "Trò chơi" to "trò chơi",
                  "Âm nhạc" to "nhạc việt",
                  "Trực tiếp" to "trực tiếp",
                  "Tin tức" to "tin tức hôm nay",
                  "Thể thao" to "thể thao",
                  "Nấu ăn" to "nấu ăn",
                  "Hoạt hình" to "hoạt hình",
                  "Công nghệ" to "công nghệ"
              )
              val feedListState = LazyListState()

              var searching by mutableStateOf(false)
              var searchText by mutableStateOf("")
              var suggestions by mutableStateOf<List<String>>(emptyList())
              var selectedChip by mutableIntStateOf(0)
              var currentQuery by mutableStateOf(chips[0].second)

              var feed by mutableStateOf<List<StreamInfoItem>>(emptyList())
              var feedLoading by mutableStateOf(false)
              var moreLoading by mutableStateOf(false)
              var feedError by mutableStateOf<String?>(null)

              private var handler: SearchQueryHandler? = null
              private var nextPage: Page? = null
              private var feedJob: Job? = null
              private var suggestJob: Job? = null

              // ---- Màn hình xem video ----
              var watching by mutableStateOf(false)
              var watch by mutableStateOf<WatchState?>(null)
              var watchLoading by mutableStateOf(false)
              var watchError by mutableStateOf<String?>(null)
              var watchTitleHint by mutableStateOf("")
              var selectedQuality by mutableIntStateOf(0)
              var playerError by mutableStateOf<String?>(null)
              var fullscreen by mutableStateOf(false)
              private var watchJob: Job? = null

              // ---- Trình phát (nằm trong PlaybackService) ----
              var player by mutableStateOf<Player?>(null)
              var inPip by mutableStateOf(false)
              private var releaseController: (() -> Unit)? = null

              init {
                  NewPipe.init(DownloaderImpl, Localization("vi", "VN"), ContentCountry("VN"))
                  loadFeed(currentQuery)
                  connectPlayer()
                  reloadUserData()
              }

              // ================= Tài khoản =================
              private fun reloadUserData() {
                  val u = userKey
                  history = if (u == null) emptyList() else store.history(u)
                  searchHistory = if (u == null) emptyList() else store.searches(u)
              }

              fun login(name: String, password: String) {
                  val err = store.loginOrRegister(name, password)
                  loginError = err
                  if (err == null) {
                      userKey = store.currentUser()
                      userName = userKey?.let { store.displayName(it) } ?: ""
                      reloadUserData()
                  }
              }

              fun logout() {
                  store.logout()
                  userKey = null
                  userName = ""
                  loginError = null
                  reloadUserData()
              }

              fun clearHistory() {
                  userKey?.let { store.clearHistory(it) }
                  reloadUserData()
              }

              fun clearSearchHistory() {
                  userKey?.let { store.clearSearches(it) }
                  reloadUserData()
              }

              private fun recordHistory(w: WatchState) {
                  val u = userKey ?: return
                  store.addHistory(
                      u,
                      HistoryEntry(w.pageUrl, w.title, w.uploader, w.thumb, w.duration, System.currentTimeMillis())
                  )
                  history = store.history(u)
              }

              private fun connectPlayer() {
                  val ctx = getApplication<Application>()
                  val token = SessionToken(ctx, ComponentName(ctx, PlaybackService::class.java))
                  val future = MediaController.Builder(ctx, token).buildAsync()
                  future.addListener({
                      try {
                          val controller = future.get()
                          controller.addListener(object : Player.Listener {
                              override fun onPlayerError(error: PlaybackException) {
                                  playerError =
                                      "Lỗi phát (${error.errorCodeName}): ${error.cause?.message ?: error.message}"
                              }

                              override fun onPlaybackStateChanged(playbackState: Int) {
                                  if (playbackState == Player.STATE_READY) playerError = null
                              }
                          })
                          player = controller
                      } catch (e: Exception) {
                          playerError = "Không kết nối được trình phát nền"
                      }
                  }, ContextCompat.getMainExecutor(ctx))
                  releaseController = { MediaController.releaseFuture(future) }
              }

              fun stopPlayback() {
                  player?.run {
                      stop()
                      clearMediaItems()
                  }
                  closeWatch()
              }

              override fun onCleared() {
                  releaseController?.invoke()
                  super.onCleared()
              }

              // ================= Feed =================
              fun loadFeed(q: String) {
                  feedJob?.cancel()
                  feedJob = viewModelScope.launch {
                      feedLoading = true
                      moreLoading = false
                      feedError = null
                      feed = emptyList()
                      nextPage = null
                      try {
                          val h = youtube.searchQHFactory.fromQuery(q, listOf("videos"), "")
                          val info = withContext(Dispatchers.IO) { SearchInfo.getInfo(youtube, h) }
                          handler = h
                          nextPage = info.nextPage
                          feed = info.relatedItems.filterIsInstance<StreamInfoItem>()
                      } catch (e: CancellationException) {
                          throw e
                      } catch (e: Exception) {
                          feedError = e.message ?: "Không tải được danh sách video"
                      }
                      feedLoading = false
                  }
              }

              fun loadMore() {
                  val page = nextPage ?: return
                  val h = handler ?: return
                  if (moreLoading || feedLoading) return
                  viewModelScope.launch {
                      moreLoading = true
                      try {
                          val res = withContext(Dispatchers.IO) { SearchInfo.getMoreItems(youtube, h, page) }
                          feed = feed + res.items.filterIsInstance<StreamInfoItem>()
                          nextPage = res.nextPage
                      } catch (e: CancellationException) {
                          throw e
                      } catch (e: Exception) {
                          nextPage = null
                      }
                      moreLoading = false
                  }
              }

              fun selectChip(i: Int) {
                  selectedChip = i
                  currentQuery = chips[i].second
                  loadFeed(currentQuery)
              }

              fun openSearch() {
                  searching = true
              }

              fun onSearchTextChange(t: String) {
                  searchText = t
                  suggestJob?.cancel()
                  if (t.isBlank()) {
                      suggestions = emptyList()
                      return
                  }
                  suggestJob = viewModelScope.launch {
                      delay(250)
                      try {
                          suggestions = withContext(Dispatchers.IO) { youtube.suggestionExtractor.suggestionList(t) }
                      } catch (e: CancellationException) {
                          throw e
                      } catch (e: Exception) {
                          // gợi ý lỗi thì bỏ qua
                      }
                  }
              }

              fun submitSearch(q: String) {
                  if (q.isBlank()) return
                  searchText = q
                  searching = false
                  suggestions = emptyList()
                  selectedChip = -1
                  currentQuery = q
                  userKey?.let {
                      store.addSearch(it, q.trim())
                      searchHistory = store.searches(it)
                  }
                  loadFeed(q)
              }

              // ================= Xem video =================
              fun play(url: String, titleHint: String = "") {
                  watchJob?.cancel()
                  watching = true
                  watchLoading = true
                  watchError = null
                  playerError = null
                  watchTitleHint = titleHint
                  watch = null
                  selectedQuality = 0
                  watchJob = viewModelScope.launch {
                      try {
                          val loaded = withContext(Dispatchers.IO) { loadWatch(url) }
                          watch = loaded
                          recordHistory(loaded)
                      } catch (e: CancellationException) {
                          throw e
                      } catch (e: Exception) {
                          watchError = e.message ?: "Không tải được video"
                      }
                      watchLoading = false
                  }
              }

              fun closeWatch() {
                  player?.run {
                      stop()
                      clearMediaItems()
                  }
                  watchJob?.cancel()
                  watching = false
                  fullscreen = false
                  watch = null
                  watchError = null
                  playerError = null
              }

              private fun loadWatch(url: String): WatchState {
                  val info = StreamInfo.getInfo(youtube, url)

                  // videoStreams = luồng đã gộp sẵn hình + tiếng
                  var qualities = info.videoStreams
                      .sortedByDescending { it.height }
                      .distinctBy { it.height }
                      .map { Quality(if (it.resolution.isNullOrBlank()) "${it.height}p" else it.resolution, it.content) }
                  if (qualities.isEmpty() && !info.hlsUrl.isNullOrBlank()) {
                      qualities = listOf(Quality("Tự động", info.hlsUrl))
                  }
                  if (qualities.isEmpty()) {
                      throw IllegalStateException("Không tìm thấy luồng phát cho video này")
                  }

                  val d = info.description
                  val desc = when {
                      d == null -> ""
                      d.type == Description.HTML ->
                          HtmlCompat.fromHtml(d.content, HtmlCompat.FROM_HTML_MODE_LEGACY).toString().trim()
                      else -> d.content.trim()
                  }

                  return WatchState(
                      pageUrl = url,
                      title = info.name,
                      uploader = info.uploaderName ?: "",
                      avatar = info.uploaderAvatars.lastOrNull()?.url,
                      subscribers = info.uploaderSubscriberCount,
                      views = info.viewCount,
                      likes = info.likeCount,
                      date = info.textualUploadDate ?: "",
                      description = desc,
                      thumb = info.thumbnails.lastOrNull()?.url,
                      duration = info.duration,
                      qualities = qualities,
                      related = info.relatedItems.filterIsInstance<StreamInfoItem>()
                  )
              }
          }
