name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Tao ma nguon
        run: |
          mkdir -p app
          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.example.adfreetube"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.example.adfreetube"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }

              buildFeatures { compose = true }
              composeOptions { kotlinCompilerExtensionVersion = "1.5.14" }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
                  isCoreLibraryDesugaringEnabled = true // NewPipeExtractor cần
              }
              kotlinOptions { jvmTarget = "17" }
          }

          dependencies {
              coreLibraryDesugaring("com.android.tools:desugar_jdk_libs_nio:2.1.5")

              // Lấy dữ liệu YouTube không quảng cáo. Bản v0.25.1 trở lên đã sửa lỗi
              // "The page needs to be reloaded". Kiểm tra bản mới nhất tại
              // https://github.com/TeamNewPipe/NewPipeExtractor/releases
              implementation("com.github.TeamNewPipe:NewPipeExtractor:v0.26.5")
              implementation("com.squareup.okhttp3:okhttp:4.12.0")

              val media3 = "1.3.1"
              implementation("androidx.media3:media3-exoplayer:$media3")
              implementation("androidx.media3:media3-exoplayer-hls:$media3")
              implementation("androidx.media3:media3-ui:$media3")
              implementation("androidx.media3:media3-session:$media3")
              implementation("com.google.guava:guava:33.2.1-android")

              implementation(platform("androidx.compose:compose-bom:2024.06.00"))
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.material:material-icons-core")
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.activity:activity-compose:1.9.0")
              implementation("androidx.lifecycle:lifecycle-viewmodel-compose:2.8.2")
              implementation("io.coil-kt:coil-compose:2.6.0")
          }
