          package com.example.adfreetube

          import android.content.Intent
          import android.os.Bundle
          import androidx.media3.common.AudioAttributes
          import androidx.media3.common.C
          import androidx.media3.common.MediaItem
          import androidx.media3.common.MediaMetadata
          import androidx.media3.datasource.DataSource
          import androidx.media3.datasource.DefaultHttpDataSource
          import androidx.media3.datasource.ResolvingDataSource
          import androidx.media3.exoplayer.ExoPlayer
          import androidx.media3.exoplayer.source.DefaultMediaSourceFactory
          import androidx.media3.exoplayer.source.MergingMediaSource
          import androidx.media3.exoplayer.source.ProgressiveMediaSource
          import androidx.media3.session.MediaSession
          import androidx.media3.session.MediaSessionService
          import androidx.media3.session.SessionCommand
          import androidx.media3.session.SessionResult
          import com.google.common.util.concurrent.Futures
          import com.google.common.util.concurrent.ListenableFuture

          /**
           * Trình phát chạy trong một dịch vụ nền (foreground service) nên tắt màn hình
           * hoặc thoát app vẫn tiếp tục phát, có thông báo điều khiển trên màn hình khóa.
           */
          class PlaybackService : MediaSessionService() {
              private var session: MediaSession? = null
              private var exo: ExoPlayer? = null
              private var dataSource: DataSource.Factory? = null

              override fun onCreate() {
                  super.onCreate()

                  // Mỗi link stream cần đúng User-Agent của "client" YouTube tạo ra nó
                  val http = DefaultHttpDataSource.Factory().setAllowCrossProtocolRedirects(true)
                  val ds = ResolvingDataSource.Factory(http) { spec ->
                      spec.withAdditionalHeaders(mapOf("User-Agent" to userAgentFor(spec.uri.toString())))
                  }
                  dataSource = ds

                  val player = ExoPlayer.Builder(this)
                      .setMediaSourceFactory(DefaultMediaSourceFactory(ds))
                      .setAudioAttributes(AudioAttributes.DEFAULT, true)
                      .setHandleAudioBecomingNoisy(true)
                      .setWakeMode(C.WAKE_MODE_NETWORK)
                      .build()
                  exo = player

                  session = MediaSession.Builder(this, player)
                      .setCallback(object : MediaSession.Callback {
                          override fun onConnect(
                              session: MediaSession,
                              controller: MediaSession.ControllerInfo
                          ): MediaSession.ConnectionResult {
                              val commands = MediaSession.ConnectionResult.DEFAULT_SESSION_COMMANDS
                                  .buildUpon()
                                  .add(SessionCommand(CMD_PLAY_MERGED, Bundle.EMPTY))
                                  .build()
                              return MediaSession.ConnectionResult.AcceptedResultBuilder(session)
                                  .setAvailableSessionCommands(commands)
                                  .build()
                          }

                          override fun onCustomCommand(
                              session: MediaSession,
                              controller: MediaSession.ControllerInfo,
                              customCommand: SessionCommand,
                              args: Bundle
                          ): ListenableFuture<SessionResult> {
                              if (customCommand.customAction == CMD_PLAY_MERGED) {
                                  playMerged(args)
                                  return Futures.immediateFuture(SessionResult(SessionResult.RESULT_SUCCESS))
                              }
                              return super.onCustomCommand(session, controller, customCommand, args)
                          }
                      })
                      .build()
              }

              /** Ghép luồng hình (không tiếng) và luồng tiếng riêng để phát được 1080p / 1440p / 4K. */
              private fun playMerged(args: Bundle) {
                  val player = exo ?: return
                  val ds = dataSource ?: return
                  val video = args.getString("video") ?: return
                  val audio = args.getString("audio") ?: return
                  val pos = args.getLong("pos", 0L)

                  val videoItem = MediaItem.Builder()
                      .setUri(video)
                      .setMediaMetadata(
                          MediaMetadata.Builder()
                              .setTitle(args.getString("title"))
                              .setArtist(args.getString("artist"))
                              .build()
                      )
                      .build()
                  val factory = ProgressiveMediaSource.Factory(ds)
                  val merged = MergingMediaSource(
                      factory.createMediaSource(videoItem),
                      factory.createMediaSource(MediaItem.fromUri(audio))
                  )
                  player.setMediaSource(merged, pos)
                  player.prepare()
                  player.play()
              }

              override fun onGetSession(controllerInfo: MediaSession.ControllerInfo): MediaSession? = session

              // Vuốt app khỏi danh sách gần đây thì dừng hẳn
              override fun onTaskRemoved(rootIntent: Intent?) {
                  session?.player?.pause()
                  stopSelf()
              }

              override fun onDestroy() {
                  session?.run {
                      player.release()
                      release()
                  }
                  session = null
                  exo = null
                  super.onDestroy()
              }

              companion object {
                  const val CMD_PLAY_MERGED = "com.example.adfreetube.PLAY_MERGED"
              }
          }
