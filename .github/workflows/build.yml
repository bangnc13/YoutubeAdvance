          /** Thẻ video kiểu YouTube: thumbnail 16:9 full-width, avatar kênh + tiêu đề + thông tin. */
          @Composable
          fun VideoCard(item: StreamInfoItem, onClick: () -> Unit) {
              val live = item.streamType == StreamType.LIVE_STREAM
              val badge = when {
                  live -> "TRỰC TIẾP"
                  item.duration > 0 -> formatDuration(item.duration)
                  else -> null
              }
              val views = item.viewCount.takeIf { it >= 0 }
                  ?.let { formatCount(it) + if (live) " đang xem" else " lượt xem" }
              val meta = listOfNotNull(
                  item.uploaderName?.takeIf { it.isNotBlank() },
                  views,
                  item.textualUploadDate?.takeIf { it.isNotBlank() }
              ).joinToString(" • ")

              Column(
                  Modifier
                      .fillMaxWidth()
                      .clickable(onClick = onClick)
                      .padding(bottom = 8.dp)
              ) {
                  Box {
                      AsyncImage(
                          model = item.thumbnails.lastOrNull()?.url,
                          contentDescription = null,
                          contentScale = ContentScale.Crop,
                          modifier = Modifier
                              .fillMaxWidth()
                              .aspectRatio(16 / 9f)
                              .background(MaterialTheme.colorScheme.surfaceVariant)
                      )
                      if (badge != null) {
                          Text(
                              badge,
                              color = Color.White,
                              fontSize = 12.sp,
                              fontWeight = FontWeight.SemiBold,
                              modifier = Modifier
                                  .align(Alignment.BottomEnd)
                                  .padding(8.dp)
                                  .clip(RoundedCornerShape(4.dp))
                                  .background(if (live) Color(0xFFCC0000) else Color(0xCC000000))
                                  .padding(horizontal = 5.dp, vertical = 1.dp)
                          )
                      }
                  }
                  Row(Modifier.padding(horizontal = 12.dp, vertical = 12.dp)) {
                      Avatar(item.uploaderAvatars.lastOrNull()?.url)
                      Spacer(Modifier.width(12.dp))
                      Column {
                          Text(
                              item.name,
                              maxLines = 2,
                              overflow = TextOverflow.Ellipsis,
                              fontSize = 15.sp,
                              lineHeight = 20.sp,
                              fontWeight = FontWeight.Medium
                          )
                          Spacer(Modifier.height(2.dp))
                          Text(
                              meta,
                              maxLines = 2,
                              overflow = TextOverflow.Ellipsis,
                              fontSize = 12.sp,
                              color = MaterialTheme.colorScheme.onSurfaceVariant
                          )
                      }
                  }
              }
          }
