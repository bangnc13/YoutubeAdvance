      - name: Build APK
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --console=plain 2>&1 | tee build.log
      - name: Tom tat loi
        if: failure()
        run: |
          echo '### Loi bien dich (gui anh phan nay cho Claude)' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          { grep -E "^e: " build.log | sed -E 's#^e: file://.*/adfreetube/#e: #' | head -30 | fold -s -w 55; } >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: AdFreeTube-apk
          path: app/build/outputs/apk/debug/app-debug.apk
