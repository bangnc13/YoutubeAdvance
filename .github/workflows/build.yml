              val focus = remember { FocusRequester() }
              val focusManager = LocalFocusManager.current
              LaunchedEffect(Unit) { focus.requestFocus() }

              Row(
                  Modifier
                      .fillMaxWidth()
                      .padding(horizontal = 4.dp, vertical = 4.dp),
