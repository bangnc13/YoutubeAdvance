          import org.schabi.newpipe.extractor.localization.ContentCountry
          import org.schabi.newpipe.extractor.localization.Localization
          import org.schabi.newpipe.extractor.search.SearchInfo
          import org.schabi.newpipe.extractor.stream.AudioStream
          import org.schabi.newpipe.extractor.stream.Description
          import org.schabi.newpipe.extractor.stream.StreamInfo
          import org.schabi.newpipe.extractor.stream.StreamInfoItem
          import org.schabi.newpipe.extractor.stream.VideoStream

          /** audioUrl != null nghĩa là luồng hình và tiếng tách riêng (1080p trở lên), cần ghép khi phát. */
          data class Quality(
              val label: String,
              val url: String,
              val audioUrl: String? = null,
              val height: Int = 0
          )

          data class WatchState(
              val pageUrl: String,
              val title: String,
              val uploader: String,
              val channelId: String?,
              val avatar: String?,
              val subscribers: Long,
              val views: Long,
              val likes: Long,
              val date: String,
              val description: String,
              val thumb: String?,
              val duration: Long,
              val qualities: List<Quality>,
              val related: List<StreamInfoItem>
          )

          class MainViewModel(app: Application) : AndroidViewModel(app) {
              private val youtube = ServiceList.YouTube
              private val store = UserStore(app)
              private val googleAuth = GoogleAuth(app)
              private val api = YouTubeApi(googleAuth)

              // ---- Tài khoản cục bộ (lịch sử trên máy) ----
              var showProfile by mutableStateOf(false)
              var userKey by mutableStateOf<String?>(store.currentUser())
              var userName by mutableStateOf(store.currentUser()?.let { store.displayName(it) } ?: "")
              var loginError by mutableStateOf<String?>(null)
              var history by mutableStateOf<List<HistoryEntry>>(emptyList())
              var searchHistory by mutableStateOf<List<String>>(emptyList())

              // ---- Kết nối YouTube (đăng ký kênh) ----
              var googleConfigured by mutableStateOf(googleAuth.isConfigured)
              var googleSignedIn by mutableStateOf(googleAuth.isSignedIn)
              var googleChannelName by mutableStateOf("")
              var googleBusy by mutableStateOf(false)
              var googleError by mutableStateOf<String?>(null)
              var deviceCode by mutableStateOf<GoogleAuth.DeviceCode?>(null)
              var subscriptions by mutableStateOf<List<Channel>>(emptyList())
              var subBusy by mutableStateOf(false)
              var subMessage by mutableStateOf<String?>(null)
              var subsMode by mutableStateOf(false)
              var subsFeed by mutableStateOf<List<FeedVideo>>(emptyList())
              var subsLoading by mutableStateOf(false)
              var subsError by mutableStateOf<String?>(null)
              private var loginJob: Job? = null

              // ---- Trang chủ / tìm kiếm ----
              val chips = listOf(
                  "Tất cả" to "xu hướng",
                  "Trò chơi" to "trò chơi",
                  "Âm nhạc" to "nhạc việt",
                  "Trực tiếp" to "trực tiếp",
                  "Tin tức" to "tin tức hôm nay",
                  "Thể thao" to "thể thao",
                  "Nấu ăn" to "nấu ăn",
                  "Hoạt hình" to "hoạt hình",
                  "Công nghệ" to "công nghệ"
              )
              val feedListState = LazyListState()

              var searching by mutableStateOf(false)
              var searchText by mutableStateOf("")
              var suggestions by mutableStateOf<List<String>>(emptyList())
              var selectedChip by mutableIntStateOf(0)
              var currentQuery by mutableStateOf(chips[0].second)

              var feed by mutableStateOf<List<StreamInfoItem>>(emptyList())
              var feedLoading by mutableStateOf(false)
              var moreLoading by mutableStateOf(false)
              var feedError by mutableStateOf<String?>(null)

              private var handler: SearchQueryHandler? = null
              private var nextPage: Page? = null
              private var feedJob: Job? = null
              private var suggestJob: Job? = null

              // ---- Màn hình xem video ----
              var watching by mutableStateOf(false)
              var watch by mutableStateOf<WatchState?>(null)
              var watchLoading by mutableStateOf(false)
              var watchError by mutableStateOf<String?>(null)
              var watchTitleHint by mutableStateOf("")
              var selectedQuality by mutableIntStateOf(0)
              var playerError by mutableStateOf<String?>(null)
              var fullscreen by mutableStateOf(false)
              private var watchJob: Job? = null

              // ---- Trình phát (nằm trong PlaybackService) ----
              var controller by mutableStateOf<MediaController?>(null)
              var player by mutableStateOf<Player?>(null)
              var inPip by mutableStateOf(false)
              private var releaseController: (() -> Unit)? = null

              init {
                  NewPipe.init(DownloaderImpl, Localization("vi", "VN"), ContentCountry("VN"))
                  loadFeed(currentQuery)
                  connectPlayer()
                  reloadUserData()
                  if (googleSignedIn) refreshSubscriptions()
              }

              private fun connectPlayer() {
                  val ctx = getApplication<Application>()
                  val token = SessionToken(ctx, ComponentName(ctx, PlaybackService::class.java))
                  val future = MediaController.Builder(ctx, token).buildAsync()
                  future.addListener({
                      try {
                          val c = future.get()
                          c.addListener(object : Player.Listener {
                              override fun onPlayerError(error: PlaybackException) {
                                  playerError =
                                      "Lỗi phát (${error.errorCodeName}): ${error.cause?.message ?: error.message}"
                              }

                              override fun onPlaybackStateChanged(playbackState: Int) {
                                  if (playbackState == Player.STATE_READY) playerError = null
                              }
                          })
                          controller = c
                          player = c
                      } catch (e: Exception) {
                          playerError = "Không kết nối được trình phát nền"
                      }
                  }, ContextCompat.getMainExecutor(ctx))
                  releaseController = { MediaController.releaseFuture(future) }
              }

              fun stopPlayback() {
                  player?.run {
                      stop()
                      clearMediaItems()
                  }
                  closeWatch()
              }

              override fun onCleared() {
                  releaseController?.invoke()
                  super.onCleared()
              }

              // ================= Tài khoản cục bộ =================
              private fun reloadUserData() {
                  val u = userKey
                  history = if (u == null) emptyList() else store.history(u)
                  searchHistory = if (u == null) emptyList() else store.searches(u)
              }

              fun login(name: String, password: String) {
                  val err = store.loginOrRegister(name, password)
                  loginError = err
                  if (err == null) {
                      userKey = store.currentUser()
                      userName = userKey?.let { store.displayName(it) } ?: ""
                      reloadUserData()
                  }
              }

              fun logout() {
                  store.logout()
                  userKey = null
                  userName = ""
                  loginError = null
                  reloadUserData()
              }

              fun clearHistory() {
                  userKey?.let { store.clearHistory(it) }
                  reloadUserData()
              }

              fun clearSearchHistory() {
                  userKey?.let { store.clearSearches(it) }
                  reloadUserData()
              }

              private fun recordHistory(w: WatchState) {
                  val u = userKey ?: return
                  store.addHistory(
                      u,
                      HistoryEntry(w.pageUrl, w.title, w.uploader, w.thumb, w.duration, System.currentTimeMillis())
                  )
                  history = store.history(u)
              }

              // ================= Kết nối YouTube =================
              fun googleClientId(): String = googleAuth.clientId
              fun googleClientSecret(): String = googleAuth.clientSecret

              fun saveGoogleConfig(clientId: String, secret: String) {
                  googleAuth.clientId = clientId
                  googleAuth.clientSecret = secret
                  googleConfigured = googleAuth.isConfigured
                  googleError = null
              }

              fun startGoogleLogin() {
                  loginJob?.cancel()
                  loginJob = viewModelScope.launch {
                      googleError = null
                      googleBusy = true
                      try {
                          val code = withContext(Dispatchers.IO) { googleAuth.requestDeviceCode() }
                          deviceCode = code
                          val deadline = System.currentTimeMillis() + code.expiresIn * 1000L
                          var ok = false
                          while (!ok && System.currentTimeMillis() < deadline) {
                              delay(code.interval * 1000L)
                              ok = withContext(Dispatchers.IO) { googleAuth.pollToken(code) }
                          }
                          if (ok) {
                              googleSignedIn = true
                              refreshSubscriptions()
                          } else {
                              googleError = "Mã đã hết hạn, hãy thử lại"
                          }
                      } catch (e: CancellationException) {
                          throw e
                      } catch (e: Exception) {
                          googleError = e.message ?: "Lỗi đăng nhập Google"
                      }
                      deviceCode = null
                      googleBusy = false
                  }
              }

              fun cancelGoogleLogin() {
                  loginJob?.cancel()
                  deviceCode = null
                  googleBusy = false
              }

              fun signOutGoogle() {
                  googleAuth.signOut()
                  googleSignedIn = false
                  googleChannelName = ""
                  subscriptions = emptyList()
                  subsFeed = emptyList()
                  subsMode = false
              }

              fun refreshSubscriptions() {
                  if (!googleSignedIn) return
                  viewModelScope.launch {
                      googleBusy = true
                      googleError = null
                      try {
                          subscriptions = withContext(Dispatchers.IO) { api.subscriptions() }
                          googleChannelName = withContext(Dispatchers.IO) {
                              try {
                                  api.myChannelName()
                              } catch (e: Exception) {
                                  ""
                              }
                          }
                      } catch (e: CancellationException) {
                          throw e
                      } catch (e: Exception) {
                          googleError = e.message
                          googleSignedIn = googleAuth.isSignedIn
                      }
                      googleBusy = false
                  }
              }

              fun isSubscribed(channelId: String): Boolean = subscriptions.any { it.id == channelId }

              fun toggleSubscribe(channelId: String) {
                  if (!googleSignedIn) {
                      subMessage = "Hãy kết nối tài khoản YouTube trong mục Tài khoản để đăng ký kênh"
                      return
                  }
                  viewModelScope.launch {
                      subBusy = true
                      subMessage = null
                      try {
                          val existing = subscriptions.firstOrNull { it.id == channelId }
                          if (existing != null) {
                              withContext(Dispatchers.IO) { api.unsubscribe(existing.subId) }
                              subscriptions = subscriptions.filter { it.id != channelId }
                          } else {
                              val c = withContext(Dispatchers.IO) { api.subscribe(channelId) }
                              subscriptions = subscriptions + c
                          }
                      } catch (e: CancellationException) {
                          throw e
                      } catch (e: Exception) {
                          subMessage = e.message ?: "Không thực hiện được"
                      }
                      subBusy = false
                  }
              }

              fun unsubscribe(channel: Channel) {
                  viewModelScope.launch {
                      try {
                          withContext(Dispatchers.IO) { api.unsubscribe(channel.subId) }
                          subscriptions = subscriptions.filter { it.id != channel.id }
                      } catch (e: CancellationException) {
                          throw e
                      } catch (e: Exception) {
                          googleError = e.message
                      }
                  }
              }

              fun openSubscriptions() {
                  subsMode = true
                  selectedChip = -1
                  viewModelScope.launch {
                      subsLoading = true
                      subsError = null
                      try {
                          var channels = subscriptions
                          if (channels.isEmpty()) {
                              channels = withContext(Dispatchers.IO) { api.subscriptions() }
                              subscriptions = channels
                          }
                          val feeds = coroutineScope {
                              channels.take(60).map { ch ->
                                  async(Dispatchers.IO) {
                                      try {
                                          api.channelFeed(ch.id)
                                      } catch (e: Exception) {
                                          emptyList<FeedVideo>()
                                      }
                                  }
                              }.awaitAll()
                          }
                          subsFeed = feeds.flatten().sortedByDescending { it.published }.take(150)
                      } catch (e: CancellationException) {
                          throw e
                      } catch (e: Exception) {
                          subsError = e.message ?: "Không tải được video từ kênh đã đăng ký"
                      }
                      subsLoading = false
                  }
              }

              // ================= Feed =================
              fun loadFeed(q: String) {
                  feedJob?.cancel()
                  feedJob = viewModelScope.launch {
                      feedLoading = true
                      moreLoading = false
                      feedError = null
                      feed = emptyList()
                      nextPage = null
                      try {
                          val h = youtube.searchQHFactory.fromQuery(q, listOf("videos"), "")
                          val info = withContext(Dispatchers.IO) { SearchInfo.getInfo(youtube, h) }
                          handler = h
                          nextPage = info.nextPage
                          feed = info.relatedItems.filterIsInstance<StreamInfoItem>()
                      } catch (e: CancellationException) {
                          throw e
                      } catch (e: Exception) {
                          feedError = e.message ?: "Không tải được danh sách video"
                      }
                      feedLoading = false
                  }
              }

              fun loadMore() {
                  val page = nextPage ?: return
                  val h = handler ?: return
                  if (moreLoading || feedLoading) return
                  viewModelScope.launch {
                      moreLoading = true
                      try {
                          val res = withContext(Dispatchers.IO) { SearchInfo.getMoreItems(youtube, h, page) }
                          feed = feed + res.items.filterIsInstance<StreamInfoItem>()
                          nextPage = res.nextPage
                      } catch (e: CancellationException) {
                          throw e
                      } catch (e: Exception) {
                          nextPage = null
                      }
                      moreLoading = false
                  }
              }

              fun selectChip(i: Int) {
                  subsMode = false
                  selectedChip = i
                  currentQuery = chips[i].second
                  loadFeed(currentQuery)
              }

              fun openSearch() {
                  searching = true
              }

              fun onSearchTextChange(t: String) {
                  searchText = t
                  suggestJob?.cancel()
                  if (t.isBlank()) {
                      suggestions = emptyList()
                      return
                  }
                  suggestJob = viewModelScope.launch {
                      delay(250)
                      try {
                          suggestions = withContext(Dispatchers.IO) { youtube.suggestionExtractor.suggestionList(t) }
                      } catch (e: CancellationException) {
                          throw e
                      } catch (e: Exception) {
                          // gợi ý lỗi thì bỏ qua
                      }
                  }
              }

              fun submitSearch(q: String) {
                  if (q.isBlank()) return
                  searchText = q
                  searching = false
                  subsMode = false
                  suggestions = emptyList()
                  selectedChip = -1
                  currentQuery = q
                  userKey?.let {
                      store.addSearch(it, q.trim())
                      searchHistory = store.searches(it)
                  }
                  loadFeed(q)
              }

              // ================= Xem video =================
              fun play(url: String, titleHint: String = "") {
                  watchJob?.cancel()
                  watching = true
                  watchLoading = true
                  watchError = null
                  playerError = null
                  subMessage = null
                  watchTitleHint = titleHint
                  watch = null
                  selectedQuality = 0
                  watchJob = viewModelScope.launch {
                      try {
                          val loaded = withContext(Dispatchers.IO) { loadWatch(url) }
                          watch = loaded
                          // Mặc định chọn chất lượng cao nhất không vượt quá 1080p
                          selectedQuality = loaded.qualities.indexOfFirst { it.height in 1..1080 }.coerceAtLeast(0)
                          recordHistory(loaded)
                      } catch (e: CancellationException) {
                          throw e
                      } catch (e: Exception) {
                          watchError = e.message ?: "Không tải được video"
                      }
                      watchLoading = false
                  }
              }

              fun closeWatch() {
                  player?.run {
                      stop()
                      clearMediaItems()
                  }
                  watchJob?.cancel()
                  watching = false
                  fullscreen = false
                  watch = null
                  watchError = null
                  playerError = null
              }

              /** Hình tách riêng (tới 4K) + tiếng tốt nhất, thêm các luồng gộp sẵn nếu chưa có độ phân giải đó. */
              private fun buildQualities(info: StreamInfo): List<Quality> {
                  val audios = info.audioStreams

                  fun pickAudio(preferM4a: Boolean): AudioStream? {
                      val pool = audios.filter { (it.format?.suffix == "m4a") == preferM4a }.ifEmpty { audios }
                      return pool.maxByOrNull { it.averageBitrate }
                  }

                  // Số nhỏ = ưu tiên hơn. Từ 1080p trở xuống ưu tiên H.264, trên 1080p ưu tiên VP9.
                  fun rank(v: VideoStream): Int {
                      val c = v.codec ?: ""
                      val high = v.height > 1080
                      return when {
                          c.startsWith("avc1") -> if (high) 2 else 0
                          c.startsWith("vp09") || c.startsWith("vp9") -> if (high) 0 else 1
                          c.startsWith("av01") -> if (high) 1 else 2
                          else -> 3
                      }
                  }

                  val out = ArrayList<Quality>()
                  val groups = info.videoOnlyStreams.groupBy { it.height to it.fps }
                  val keys = groups.keys.sortedWith(
                      compareByDescending<Pair<Int, Int>> { it.first }.thenByDescending { it.second }
                  )
                  for (key in keys) {
                      val h = key.first
                      val fps = key.second
                      val best = groups.getValue(key)
                          .sortedWith(compareBy<VideoStream>({ rank(it) }, { -it.bitrate }))
                          .first()
                      val audio = pickAudio(best.format?.suffix == "mp4") ?: continue
                      val tag = when {
                          h >= 2160 -> " (4K)"
                          h >= 1440 -> " (2K)"
                          h >= 1080 -> " (Full HD)"
                          h >= 720 -> " (HD)"
                          else -> ""
                      }
                      val label = "${h}p" + (if (fps > 30) "$fps" else "") + tag
                      out.add(Quality(label, best.content, audio.content, h))
                  }

                  val adaptiveHeights = out.map { it.height }.toSet()
                  info.videoStreams
                      .sortedByDescending { it.height }
                      .distinctBy { it.height }
                      .forEach { v ->
                          if (v.height !in adaptiveHeights) {
                              out.add(Quality("${v.height}p", v.content, null, v.height))
                          }
                      }
                  return out.sortedByDescending { it.height }
              }

              private fun loadWatch(url: String): WatchState {
                  val info = StreamInfo.getInfo(youtube, url)

                  var qualities = buildQualities(info)
                  if (qualities.isEmpty() && !info.hlsUrl.isNullOrBlank()) {
                      qualities = listOf(Quality("Tự động", info.hlsUrl, null, 0))
                  }
                  if (qualities.isEmpty()) {
                      throw IllegalStateException("Không tìm thấy luồng phát cho video này")
                  }

                  val d = info.description
                  val desc = when {
                      d == null -> ""
                      d.type == Description.HTML ->
                          HtmlCompat.fromHtml(d.content, HtmlCompat.FROM_HTML_MODE_LEGACY).toString().trim()
                      else -> d.content.trim()
                  }

                  return WatchState(
                      pageUrl = url,
                      title = info.name,
                      uploader = info.uploaderName ?: "",
                      channelId = info.uploaderUrl?.substringAfterLast('/')?.takeIf { it.startsWith("UC") },
                      avatar = info.uploaderAvatars.lastOrNull()?.url,
                      subscribers = info.uploaderSubscriberCount,
                      views = info.viewCount,
                      likes = info.likeCount,
                      date = info.textualUploadDate ?: "",
                      description = desc,
                      thumb = info.thumbnails.lastOrNull()?.url,
                      duration = info.duration,
                      qualities = qualities,
                      related = info.relatedItems.filterIsInstance<StreamInfoItem>()
                  )
              }
          }
