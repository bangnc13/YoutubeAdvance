          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.platform.LocalLifecycleOwner
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.text.style.TextOverflow
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import androidx.compose.ui.viewinterop.AndroidView
          import androidx.lifecycle.Lifecycle
          import androidx.lifecycle.LifecycleEventObserver
          import androidx.media3.common.MediaItem
          import androidx.media3.common.MediaMetadata
          import androidx.media3.common.PlaybackException
          import androidx.media3.common.Player
          import androidx.media3.datasource.DefaultHttpDataSource
          import androidx.media3.exoplayer.ExoPlayer
          import androidx.media3.exoplayer.source.DefaultMediaSourceFactory
          import androidx.media3.ui.PlayerView

          @Composable
          fun WatchScreen(vm: MainViewModel) {
              val w = vm.watch
              val quality = w?.qualities?.getOrNull(vm.selectedQuality)
              val player = vm.player
              val big = vm.fullscreen || vm.inPip

              // Gỡ PlayerView khỏi trình phát khi rời màn hình (trình phát vẫn sống trong dịch vụ nền)
              val holder = remember { arrayOfNulls<PlayerView>(1) }
              DisposableEffect(Unit) { onDispose { holder[0]?.player = null } }

              // Nạp video mới / đổi chất lượng (giữ nguyên vị trí đang xem khi chỉ đổi chất lượng)
              var lastPage by remember { mutableStateOf<String?>(null) }
              LaunchedEffect(w?.pageUrl, quality?.url, player) {
                  if (w == null || quality == null || player == null) return@LaunchedEffect
                  val pos = if (lastPage == w.pageUrl) player.currentPosition else 0L
                  lastPage = w.pageUrl
                  vm.playerError = null
                  val item = MediaItem.Builder()
                      .setUri(quality.url)
                      .setMediaMetadata(
                          MediaMetadata.Builder()
                              .setTitle(w.title)
                              .setArtist(w.uploader)
                              .build()
                      )
                      .build()
                  player.setMediaItem(item, pos)
                  player.prepare()
                  player.play()
              }

              Column(Modifier.fillMaxSize()) {
                  Box(
                      (if (big) Modifier.fillMaxSize()
                      else Modifier
                          .fillMaxWidth()
                          .aspectRatio(16 / 9f))
                          .background(Color.Black)
                  ) {
                      AndroidView(
                          factory = { c ->
                              PlayerView(c).apply {
                                  setShowNextButton(false)
                                  setShowPreviousButton(false)
                                  setFullscreenButtonClickListener { isFull -> vm.fullscreen = isFull }
                              }.also { holder[0] = it }
                          },
                          update = { view ->
                              view.player = player
                              view.useController = !vm.inPip
                          },
                          modifier = Modifier.fillMaxSize()
                      )
                      if (w == null && vm.watchLoading && !vm.inPip) {
                          CircularProgressIndicator(Modifier.align(Alignment.Center), color = Color.White)
                      }
                  }

                  if (!big) {
                      if (w == null) {
                          Column(Modifier.padding(12.dp)) {
                              if (vm.watchTitleHint.isNotEmpty()) {
                                  Text(vm.watchTitleHint, fontSize = 18.sp, fontWeight = FontWeight.SemiBold)
                              }
                              vm.watchError?.let {
                                  Spacer(Modifier.height(12.dp))
                                  Text(it, color = MaterialTheme.colorScheme.error)
                              }
                          }
                      } else {
                          WatchDetails(vm, w)
                      }
                  }
              }
          }

          @Composable
          private fun WatchDetails(vm: MainViewModel, w: WatchState) {
              val ctx = LocalContext.current
              val dim = MaterialTheme.colorScheme.onSurfaceVariant

              LazyColumn(Modifier.fillMaxSize()) {
                  vm.playerError?.let { msg ->
                      item {
                          Text(
                              msg,
                              color = MaterialTheme.colorScheme.error,
                              fontSize = 13.sp,
                              modifier = Modifier.padding(12.dp)
                          )
                      }
                  }

                  // Tiêu đề
                  item {
                      Column(Modifier.padding(start = 12.dp, end = 12.dp, top = 12.dp)) {
                          Text(
                              w.title,
                              fontSize = 18.sp,
                              lineHeight = 24.sp,
                              fontWeight = FontWeight.SemiBold
                          )
                      }
                  }

                  // Kênh
                  item {
                      Row(
                          Modifier
                              .fillMaxWidth()
                              .padding(12.dp),
                          verticalAlignment = Alignment.CenterVertically
                      ) {
                          Avatar(w.avatar, 40.dp)
                          Spacer(Modifier.width(12.dp))
                          Column {
                              Text(
                                  w.uploader,
                                  fontWeight = FontWeight.SemiBold,
                                  fontSize = 15.sp,
                                  maxLines = 1,
                                  overflow = TextOverflow.Ellipsis
                              )
                              if (w.subscribers >= 0) {
                                  Text(
                                      formatCount(w.subscribers) + " người đăng ký",
                                      fontSize = 12.sp,
                                      color = dim
                                  )
                              }
                          }
                      }
                  }

                  // Hàng nút: lượt thích, chia sẻ, chất lượng
                  item {
                      var menu by remember { mutableStateOf(false) }
                      Row(
                          Modifier
                              .horizontalScroll(rememberScrollState())
                              .padding(horizontal = 12.dp),
                          horizontalArrangement = Arrangement.spacedBy(8.dp)
                      ) {
                          if (w.likes >= 0) Pill(formatCount(w.likes), Icons.Filled.ThumbUp)
                          Pill("Chia sẻ", Icons.Filled.Share) {
                              val send = Intent(Intent.ACTION_SEND).apply {
                                  type = "text/plain"
                                  putExtra(Intent.EXTRA_TEXT, w.pageUrl)
                              }
                              ctx.startActivity(Intent.createChooser(send, "Chia sẻ video"))
                          }
                          Box {
                              Pill(
                                  w.qualities.getOrNull(vm.selectedQuality)?.label ?: "Chất lượng",
                                  Icons.Filled.Settings
                              ) { menu = true }
                              DropdownMenu(expanded = menu, onDismissRequest = { menu = false }) {
                                  w.qualities.forEachIndexed { i, q ->
                                      DropdownMenuItem(
                                          text = { Text(q.label) },
                                          onClick = {
                                              vm.selectedQuality = i
                                              menu = false
                                          }
                                      )
                                  }
                              }
                          }
                      }
                  }

                  // Mô tả
                  item {
                      var expanded by remember(w.pageUrl) { mutableStateOf(false) }
                      val meta = listOfNotNull(
                          w.views.takeIf { it >= 0 }?.let { formatCount(it) + " lượt xem" },
                          w.date.takeIf { it.isNotBlank() }
                      ).joinToString("  ")
                      Column(
                          Modifier
                              .padding(12.dp)
                              .fillMaxWidth()
                              .clip(RoundedCornerShape(12.dp))
                              .background(MaterialTheme.colorScheme.surfaceVariant)
                              .clickable { expanded = !expanded }
                              .padding(12.dp)
                      ) {
                          if (meta.isNotEmpty()) {
                              Text(meta, fontSize = 13.sp, fontWeight = FontWeight.SemiBold)
                              Spacer(Modifier.height(4.dp))
                          }
                          if (w.description.isNotBlank()) {
                              Text(
                                  w.description,
                                  fontSize = 13.sp,
                                  maxLines = if (expanded) Int.MAX_VALUE else 3,
                                  overflow = TextOverflow.Ellipsis
                              )
                          }
                      }
                  }

                  // Video đề xuất
                  items(w.related) { item ->
                      VideoCard(item) { vm.play(item.url, item.name) }
                  }
              }
          }
