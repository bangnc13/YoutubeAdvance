name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Tao ma nguon
        run: |
          mkdir -p app
          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.example.adfreetube"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.example.adfreetube"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }

              buildFeatures { compose = true }
              composeOptions { kotlinCompilerExtensionVersion = "1.5.14" }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
                  isCoreLibraryDesugaringEnabled = true // NewPipeExtractor cần
              }
              kotlinOptions { jvmTarget = "17" }
          }

          dependencies {
              coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.0.4")

              // Lấy dữ liệu YouTube không quảng cáo. Kiểm tra bản mới nhất tại
              // https://github.com/TeamNewPipe/NewPipeExtractor/releases
              implementation("com.github.TeamNewPipe:NewPipeExtractor:v0.24.6")
              implementation("com.squareup.okhttp3:okhttp:4.12.0")

              val media3 = "1.3.1"
              implementation("androidx.media3:media3-exoplayer:$media3")
              implementation("androidx.media3:media3-exoplayer-hls:$media3")
              implementation("androidx.media3:media3-ui:$media3")

              implementation(platform("androidx.compose:compose-bom:2024.06.00"))
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.ui:ui")
              implementation("androidx.activity:activity-compose:1.9.0")
              implementation("androidx.lifecycle:lifecycle-viewmodel-compose:2.8.2")
              implementation("io.coil-kt:coil-compose:2.6.0")
          }
          EOF
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:allowBackup="true"
                  android:label="AdFreeTube"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          mkdir -p app/src/main/java/com/example/adfreetube
          cat > app/src/main/java/com/example/adfreetube/DownloaderImpl.kt <<'EOF'
          package com.example.adfreetube

          import okhttp3.OkHttpClient
          import okhttp3.RequestBody.Companion.toRequestBody
          import org.schabi.newpipe.extractor.downloader.Downloader
          import org.schabi.newpipe.extractor.downloader.Request
          import org.schabi.newpipe.extractor.downloader.Response
          import org.schabi.newpipe.extractor.exceptions.ReCaptchaException
          import java.util.concurrent.TimeUnit

          /** NewPipeExtractor cần một Downloader để gửi HTTP request. */
          object DownloaderImpl : Downloader() {
              const val USER_AGENT =
                  "Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:128.0) Gecko/20100101 Firefox/128.0"

              private val client = OkHttpClient.Builder()
                  .readTimeout(30, TimeUnit.SECONDS)
                  .build()

              override fun execute(request: Request): Response {
                  val body = request.dataToSend()?.toRequestBody()
                  val builder = okhttp3.Request.Builder()
                      .method(request.httpMethod(), body)
                      .url(request.url())
                      .header("User-Agent", USER_AGENT)

                  request.headers().forEach { (name, values) ->
                      builder.removeHeader(name)
                      values.forEach { builder.addHeader(name, it) }
                  }

                  client.newCall(builder.build()).execute().use { resp ->
                      if (resp.code == 429) {
                          throw ReCaptchaException("reCaptcha Challenge requested", request.url())
                      }
                      return Response(
                          resp.code,
                          resp.message,
                          resp.headers.toMultimap(),
                          resp.body?.string(),
                          resp.request.url.toString()
                      )
                  }
              }
          }
          EOF
          mkdir -p app/src/main/java/com/example/adfreetube
          cat > app/src/main/java/com/example/adfreetube/MainActivity.kt <<'EOF'
          package com.example.adfreetube

          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.BackHandler
          import androidx.activity.compose.setContent
          import androidx.activity.viewModels
          import androidx.compose.foundation.clickable
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.LazyColumn
          import androidx.compose.foundation.lazy.items
          import androidx.compose.foundation.text.KeyboardActions
          import androidx.compose.foundation.text.KeyboardOptions
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.draw.clip
          import androidx.compose.ui.layout.ContentScale
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.text.input.ImeAction
          import androidx.compose.ui.text.style.TextOverflow
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.viewinterop.AndroidView
          import androidx.media3.common.MediaItem
          import androidx.media3.datasource.DefaultHttpDataSource
          import androidx.media3.exoplayer.ExoPlayer
          import androidx.media3.exoplayer.source.DefaultMediaSourceFactory
          import androidx.media3.ui.PlayerView
          import coil.compose.AsyncImage
          import org.schabi.newpipe.extractor.NewPipe
          import org.schabi.newpipe.extractor.stream.StreamInfoItem

          class MainActivity : ComponentActivity() {
              private val vm: MainViewModel by viewModels()

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  NewPipe.init(DownloaderImpl)
                  setContent { MaterialTheme { App(vm) } }
              }
          }

          @OptIn(ExperimentalMaterial3Api::class)
          @Composable
          fun App(vm: MainViewModel) {
              BackHandler(enabled = vm.playingUrl != null) { vm.closePlayer() }

              Scaffold(topBar = { TopAppBar(title = { Text("AdFreeTube") }) }) { pad ->
                  Column(Modifier.padding(pad).fillMaxSize()) {

                      vm.playingUrl?.let { url ->
                          VideoPlayer(url)
                          Text(
                              vm.playingTitle,
                              style = MaterialTheme.typography.titleMedium,
                              modifier = Modifier.padding(12.dp)
                          )
                          TextButton(onClick = { vm.closePlayer() }, modifier = Modifier.padding(horizontal = 4.dp)) {
                              Text("Đóng trình phát")
                          }
                      }

                      OutlinedTextField(
                          value = vm.query,
                          onValueChange = { vm.query = it },
                          label = { Text("Tìm kiếm video") },
                          singleLine = true,
                          keyboardOptions = KeyboardOptions(imeAction = ImeAction.Search),
                          keyboardActions = KeyboardActions(onSearch = { vm.search() }),
                          modifier = Modifier.fillMaxWidth().padding(12.dp)
                      )

                      if (vm.loading) LinearProgressIndicator(Modifier.fillMaxWidth())
                      vm.error?.let {
                          Text(it, color = MaterialTheme.colorScheme.error, modifier = Modifier.padding(12.dp))
                      }

                      LazyColumn(Modifier.fillMaxSize()) {
                          items(vm.results) { item -> VideoRow(item) { vm.play(item) } }
                      }
                  }
              }
          }

          @Composable
          fun VideoRow(item: StreamInfoItem, onClick: () -> Unit) {
              Row(
                  Modifier.fillMaxWidth().clickable(onClick = onClick).padding(horizontal = 12.dp, vertical = 8.dp),
                  verticalAlignment = Alignment.CenterVertically
              ) {
                  AsyncImage(
                      model = item.thumbnails.firstOrNull()?.url,
                      contentDescription = null,
                      contentScale = ContentScale.Crop,
                      modifier = Modifier.width(140.dp).aspectRatio(16 / 9f).clip(MaterialTheme.shapes.small)
                  )
                  Spacer(Modifier.width(12.dp))
                  Column {
                      Text(item.name, maxLines = 2, overflow = TextOverflow.Ellipsis,
                          style = MaterialTheme.typography.bodyLarge)
                      Text(item.uploaderName ?: "", style = MaterialTheme.typography.bodySmall,
                          color = MaterialTheme.colorScheme.onSurfaceVariant)
                  }
              }
          }

          @Composable
          fun VideoPlayer(url: String) {
              val context = LocalContext.current
              val player = remember(url) {
                  val dataSource = DefaultHttpDataSource.Factory()
                      .setUserAgent(DownloaderImpl.USER_AGENT)
                      .setAllowCrossProtocolRedirects(true)
                  ExoPlayer.Builder(context)
                      .setMediaSourceFactory(DefaultMediaSourceFactory(dataSource))
                      .build()
                      .apply {
                          setMediaItem(MediaItem.fromUri(url))
                          prepare()
                          playWhenReady = true
                      }
              }
              DisposableEffect(player) { onDispose { player.release() } }

              AndroidView(
                  factory = { PlayerView(it).apply { this.player = player } },
                  modifier = Modifier.fillMaxWidth().aspectRatio(16 / 9f)
              )
          }
          EOF
          mkdir -p app/src/main/java/com/example/adfreetube
          cat > app/src/main/java/com/example/adfreetube/MainViewModel.kt <<'EOF'
          package com.example.adfreetube

          import androidx.compose.runtime.getValue
          import androidx.compose.runtime.mutableStateOf
          import androidx.compose.runtime.setValue
          import androidx.lifecycle.ViewModel
          import androidx.lifecycle.viewModelScope
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.launch
          import kotlinx.coroutines.withContext
          import org.schabi.newpipe.extractor.ServiceList
          import org.schabi.newpipe.extractor.search.SearchInfo
          import org.schabi.newpipe.extractor.stream.StreamInfo
          import org.schabi.newpipe.extractor.stream.StreamInfoItem

          class MainViewModel : ViewModel() {
              var query by mutableStateOf("")
              var results by mutableStateOf<List<StreamInfoItem>>(emptyList())
              var loading by mutableStateOf(false)
              var error by mutableStateOf<String?>(null)

              var playingUrl by mutableStateOf<String?>(null)
              var playingTitle by mutableStateOf("")

              private val youtube = ServiceList.YouTube

              fun search() {
                  if (query.isBlank()) return
                  viewModelScope.launch {
                      loading = true
                      error = null
                      try {
                          results = withContext(Dispatchers.IO) {
                              val handler = youtube.searchQHFactory
                                  .fromQuery(query, listOf("videos"), "")
                              SearchInfo.getInfo(youtube, handler)
                                  .relatedItems
                                  .filterIsInstance<StreamInfoItem>()
                          }
                      } catch (e: Exception) {
                          error = e.message ?: "Lỗi không xác định"
                      }
                      loading = false
                  }
              }

              fun play(item: StreamInfoItem) {
                  viewModelScope.launch {
                      loading = true
                      error = null
                      try {
                          val url = withContext(Dispatchers.IO) {
                              val info = StreamInfo.getInfo(youtube, item.url)
                              // videoStreams = luồng đã gộp sẵn hình + tiếng (tối đa ~720p)
                              info.videoStreams.maxByOrNull { it.height }?.content
                                  ?: info.hlsUrl // video trực tiếp (live)
                                  ?: throw IllegalStateException("Không tìm thấy luồng phát")
                          }
                          playingTitle = item.name
                          playingUrl = url
                      } catch (e: Exception) {
                          error = e.message ?: "Không phát được video"
                      }
                      loading = false
                  }
              }

              fun closePlayer() { playingUrl = null }
          }
          EOF
          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m
          android.useAndroidX=true
          kotlin.code.style=official
          EOF
          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
                  maven("https://jitpack.io") // NewPipeExtractor
              }
          }
          rootProject.name = "AdFreeTube"
          include(":app")
          EOF
      - name: Build APK
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: AdFreeTube-apk
          path: app/build/outputs/apk/debug/app-debug.apk
