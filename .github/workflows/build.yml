          package com.example.adfreetube

          import android.content.pm.ActivityInfo
          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.BackHandler
          import androidx.activity.compose.setContent
          import androidx.activity.viewModels
          import androidx.compose.material3.MaterialTheme
          import androidx.compose.material3.Surface
          import androidx.compose.runtime.Composable
          import androidx.compose.runtime.LaunchedEffect
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.foundation.layout.fillMaxSize
          import androidx.core.view.WindowCompat
          import androidx.core.view.WindowInsetsCompat
          import androidx.core.view.WindowInsetsControllerCompat

          class MainActivity : ComponentActivity() {
              private val vm: MainViewModel by viewModels()

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  WindowCompat.setDecorFitsSystemWindows(window, true)
                  setContent {
                      AdFreeTheme { App(vm) }
                  }
              }
          }

          @Composable
          fun App(vm: MainViewModel) {
              BackHandler(enabled = vm.fullscreen || vm.watching || vm.searching) {
                  when {
                      vm.fullscreen -> vm.fullscreen = false
                      vm.watching -> vm.closeWatch()
                      else -> vm.searching = false
                  }
              }
              FullscreenEffect(vm)

              Surface(Modifier.fillMaxSize(), color = MaterialTheme.colorScheme.background) {
                  if (vm.watching) WatchScreen(vm) else HomeScreen(vm)
              }
          }

          /** Bật/tắt chế độ toàn màn hình: xoay ngang và ẩn thanh hệ thống. */
          @Composable
          private fun FullscreenEffect(vm: MainViewModel) {
              val ctx = LocalContext.current
              LaunchedEffect(vm.fullscreen) {
                  val act = ctx.findActivity() ?: return@LaunchedEffect
                  val controller = WindowCompat.getInsetsController(act.window, act.window.decorView)
                  if (vm.fullscreen) {
                      act.requestedOrientation = ActivityInfo.SCREEN_ORIENTATION_SENSOR_LANDSCAPE
                      controller.systemBarsBehavior =
                          WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE
                      controller.hide(WindowInsetsCompat.Type.systemBars())
                  } else {
                      act.requestedOrientation = ActivityInfo.SCREEN_ORIENTATION_UNSPECIFIED
                      controller.show(WindowInsetsCompat.Type.systemBars())
                  }
              }
          }
