          package com.example.adfreetube

          import android.app.Activity
          import android.content.Context
          import android.content.ContextWrapper
          import java.util.Locale

          /** 1234567 -> "1,2 Tr" (kiểu YouTube tiếng Việt: N = nghìn, Tr = triệu, Tỷ = tỷ). */
          fun formatCount(n: Long): String {
              if (n < 0) return ""
              fun f(v: Double, unit: String): String {
                  val s = if (v >= 100 || v == Math.floor(v)) String.format(Locale.US, "%.0f", v)
                  else String.format(Locale.US, "%.1f", v)
                  return s.replace('.', ',') + " " + unit
              }
              return when {
                  n >= 1_000_000_000L -> f(n / 1e9, "Tỷ")
                  n >= 1_000_000L -> f(n / 1e6, "Tr")
                  n >= 1_000L -> f(n / 1e3, "N")
                  else -> n.toString()
              }
          }

          fun formatDuration(sec: Long): String {
              if (sec < 0) return ""
              val h = sec / 3600
              val m = (sec % 3600) / 60
              val s = sec % 60
              return if (h > 0) String.format(Locale.US, "%d:%02d:%02d", h, m, s)
              else String.format(Locale.US, "%d:%02d", m, s)
          }

          tailrec fun Context.findActivity(): Activity? = when (this) {
              is Activity -> this
              is ContextWrapper -> baseContext.findActivity()
              else -> null
          }

          private const val ANDROID_UA =
              "com.google.android.youtube/19.28.35 (Linux; U; Android 15; GB) gzip"
          private const val IOS_UA =
              "com.google.ios.youtube/20.03.02 (iPhone16,2; U; CPU iOS 18_2_1 like Mac OS X;)"

          /** Link stream của từng "client" YouTube cần đúng User-Agent, nếu không dễ bị lỗi 403. */
          fun userAgentFor(url: String): String = when {
              "c=IOS" in url -> IOS_UA
              "c=ANDROID" in url -> ANDROID_UA
              else -> DownloaderImpl.USER_AGENT
          }
