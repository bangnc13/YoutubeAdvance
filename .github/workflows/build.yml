          package com.example.adfreetube

          import android.Manifest
          import android.app.PictureInPictureParams
          import android.content.Context
          import android.content.pm.ActivityInfo
          import android.content.pm.PackageManager
          import android.content.res.Configuration
          import android.os.Build
          import android.os.Bundle
          import android.os.PowerManager
          import android.util.Rational
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.BackHandler
          import androidx.activity.compose.setContent
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.activity.viewModels
          import androidx.compose.foundation.layout.fillMaxSize
          import androidx.compose.material3.MaterialTheme
          import androidx.compose.material3.Surface
          import androidx.compose.runtime.Composable
          import androidx.compose.runtime.LaunchedEffect
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.platform.LocalContext
          import androidx.core.content.ContextCompat
          import androidx.core.view.WindowCompat
          import androidx.core.view.WindowInsetsCompat
          import androidx.core.view.WindowInsetsControllerCompat

          class MainActivity : ComponentActivity() {
              private val vm: MainViewModel by viewModels()

              private val notificationPermission =
                  registerForActivityResult(ActivityResultContracts.RequestPermission()) { }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  WindowCompat.setDecorFitsSystemWindows(window, true)

                  // Android 13+: cần quyền thông báo để hiện nút điều khiển khi phát nền
                  if (Build.VERSION.SDK_INT >= 33 &&
                      ContextCompat.checkSelfPermission(this, Manifest.permission.POST_NOTIFICATIONS)
                      != PackageManager.PERMISSION_GRANTED
                  ) {
                      notificationPermission.launch(Manifest.permission.POST_NOTIFICATIONS)
                  }

                  setContent {
                      AdFreeTheme { App(vm) }
                  }
              }

              /** Bấm Home / chuyển app khi đang phát -> thu nhỏ thành cửa sổ nổi (Picture-in-Picture). */
              override fun onUserLeaveHint() {
                  super.onUserLeaveHint()
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O &&
                      vm.watching && vm.player?.isPlaying == true
                  ) {
                      val params = PictureInPictureParams.Builder()
                          .setAspectRatio(Rational(16, 9))
                          .build()
                      enterPictureInPictureMode(params)
                  }
              }

              override fun onPictureInPictureModeChanged(
                  isInPictureInPictureMode: Boolean,
                  newConfig: Configuration
              ) {
                  super.onPictureInPictureModeChanged(isInPictureInPictureMode, newConfig)
                  vm.inPip = isInPictureInPictureMode
              }

              /** Đóng cửa sổ nổi (bấm X) -> dừng phát. Tắt màn hình thì vẫn phát tiếp. */
              override fun onStop() {
                  super.onStop()
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O && isInPictureInPictureMode) {
                      val pm = getSystemService(Context.POWER_SERVICE) as PowerManager
                      if (pm.isInteractive) vm.stopPlayback()
                  }
              }
          }

          @Composable
          fun App(vm: MainViewModel) {
              BackHandler(enabled = vm.fullscreen || vm.watching || vm.showProfile || vm.searching) {
                  when {
                      vm.fullscreen -> vm.fullscreen = false
                      vm.watching -> vm.closeWatch()
                      vm.showProfile -> vm.showProfile = false
                      else -> vm.searching = false
                  }
              }
              FullscreenEffect(vm)

              Surface(Modifier.fillMaxSize(), color = MaterialTheme.colorScheme.background) {
                  when {
                      vm.watching -> WatchScreen(vm)
                      vm.showProfile -> ProfileScreen(vm)
                      else -> HomeScreen(vm)
                  }
              }
          }

          /** Bật/tắt chế độ toàn màn hình: xoay ngang và ẩn thanh hệ thống. */
          @Composable
          private fun FullscreenEffect(vm: MainViewModel) {
              val ctx = LocalContext.current
              LaunchedEffect(vm.fullscreen) {
                  val act = ctx.findActivity() ?: return@LaunchedEffect
                  val controller = WindowCompat.getInsetsController(act.window, act.window.decorView)
                  if (vm.fullscreen) {
                      act.requestedOrientation = ActivityInfo.SCREEN_ORIENTATION_SENSOR_LANDSCAPE
                      controller.systemBarsBehavior =
                          WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE
                      controller.hide(WindowInsetsCompat.Type.systemBars())
                  } else {
                      act.requestedOrientation = ActivityInfo.SCREEN_ORIENTATION_UNSPECIFIED
                      controller.show(WindowInsetsCompat.Type.systemBars())
                  }
              }
          }
