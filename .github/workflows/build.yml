          package com.example.adfreetube

          import android.content.Context
          import okhttp3.FormBody
          import okhttp3.OkHttpClient
          import okhttp3.Request
          import org.json.JSONObject

          /**
           * Đăng nhập Google bằng "device flow" chính thức của Google (nhập mã tại google.com/device).
           * Người dùng tự tạo Client ID / Client secret trong Google Cloud Console và dán vào app.
           */
          class GoogleAuth(context: Context) {
              private val prefs = context.getSharedPreferences("bangnc_google", Context.MODE_PRIVATE)
              private val http = OkHttpClient()

              class DeviceCode(
                  val deviceCode: String,
                  val userCode: String,
                  val url: String,
                  val interval: Int,
                  val expiresIn: Int
              )

              var clientId: String
                  get() = prefs.getString("client_id", "") ?: ""
                  set(v) {
                      prefs.edit().putString("client_id", v.trim()).apply()
                  }

              var clientSecret: String
                  get() = prefs.getString("client_secret", "") ?: ""
                  set(v) {
                      prefs.edit().putString("client_secret", v.trim()).apply()
                  }

              val isConfigured: Boolean get() = clientId.isNotBlank() && clientSecret.isNotBlank()
              val isSignedIn: Boolean get() = !prefs.getString("refresh_token", null).isNullOrEmpty()

              fun requestDeviceCode(): DeviceCode {
                  val json = post(
                      "https://oauth2.googleapis.com/device/code",
                      mapOf("client_id" to clientId, "scope" to "https://www.googleapis.com/auth/youtube")
                  )
                  if (json.has("error")) {
                      throw IllegalStateException(json.optString("error_description", json.optString("error")))
                  }
                  return DeviceCode(
                      json.getString("device_code"),
                      json.getString("user_code"),
                      json.optString("verification_url", "https://www.google.com/device"),
                      json.optInt("interval", 5),
                      json.optInt("expires_in", 1800)
                  )
              }

              /** true = đã được duyệt và lưu token; false = người dùng chưa xác nhận, cứ chờ tiếp. */
              fun pollToken(code: DeviceCode): Boolean {
                  val json = post(
                      TOKEN_URL,
                      mapOf(
                          "client_id" to clientId,
                          "client_secret" to clientSecret,
                          "device_code" to code.deviceCode,
                          "grant_type" to "urn:ietf:params:oauth:grant-type:device_code"
                      )
                  )
                  val err = json.optString("error")
                  if (err == "authorization_pending" || err == "slow_down") return false
                  if (err.isNotEmpty()) {
                      throw IllegalStateException(json.optString("error_description", err))
                  }
                  saveTokens(json)
                  return true
              }

              fun accessToken(): String {
                  val token = prefs.getString("access_token", null)
                  if (token != null && System.currentTimeMillis() < prefs.getLong("expires_at", 0L)) return token

                  val refresh = prefs.getString("refresh_token", null)
                      ?: throw IllegalStateException("Chưa đăng nhập Google")
                  val json = post(
                      TOKEN_URL,
                      mapOf(
                          "client_id" to clientId,
                          "client_secret" to clientSecret,
                          "refresh_token" to refresh,
                          "grant_type" to "refresh_token"
                      )
                  )
                  if (json.has("error")) {
                      if (json.optString("error") == "invalid_grant") signOut()
                      throw IllegalStateException("Phiên đăng nhập Google đã hết hạn, hãy đăng nhập lại")
                  }
                  saveTokens(json)
                  return json.getString("access_token")
              }

              fun signOut() {
                  prefs.edit()
                      .remove("access_token")
                      .remove("refresh_token")
                      .remove("expires_at")
                      .apply()
              }

              private fun saveTokens(json: JSONObject) {
                  val e = prefs.edit()
                  e.putString("access_token", json.getString("access_token"))
                  e.putLong("expires_at", System.currentTimeMillis() + (json.optLong("expires_in", 3600) - 60) * 1000)
                  val rt = json.optString("refresh_token")
                  if (rt.isNotEmpty()) e.putString("refresh_token", rt)
                  e.apply()
              }

              private fun post(url: String, params: Map<String, String>): JSONObject {
                  val body = FormBody.Builder().apply {
                      params.forEach { (k, v) -> add(k, v) }
                  }.build()
                  http.newCall(Request.Builder().url(url).post(body).build()).execute().use { r ->
                      return JSONObject(r.body?.string() ?: "{}")
                  }
              }

              private companion object {
                  const val TOKEN_URL = "https://oauth2.googleapis.com/token"
              }
          }
