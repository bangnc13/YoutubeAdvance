          package com.example.adfreetube

          import android.content.Context
          import org.json.JSONArray
          import org.json.JSONObject
          import java.security.MessageDigest
          import java.security.SecureRandom

          data class HistoryEntry(
              val url: String,
              val title: String,
              val uploader: String,
              val thumb: String?,
              val duration: Long,
              val time: Long
          )

          /**
           * Tài khoản cục bộ: tên + mật khẩu (băm SHA-256 có muối), lịch sử xem và lịch sử tìm kiếm
           * của từng tài khoản. Tất cả lưu trên chính điện thoại này.
           */
          class UserStore(context: Context) {
              private val prefs = context.getSharedPreferences("bangnc_tube", Context.MODE_PRIVATE)

              private fun users() = JSONObject(prefs.getString("users", "{}") ?: "{}")

              fun currentUser(): String? = prefs.getString("current_user", null)

              fun displayName(key: String): String = users().optJSONObject(key)?.optString("name", key) ?: key

              fun logout() {
                  prefs.edit().remove("current_user").apply()
              }

              /** Tên đã có -> kiểm tra mật khẩu; tên chưa có -> tạo mới. Trả về null nếu OK, ngược lại là thông báo lỗi. */
              fun loginOrRegister(name: String, password: String): String? {
                  val n = name.trim()
                  if (n.length < 2) return "Tên cần ít nhất 2 ký tự"
                  if (password.length < 4) return "Mật khẩu cần ít nhất 4 ký tự"
                  val users = users()
                  val key = n.lowercase()
                  if (users.has(key)) {
                      val u = users.getJSONObject(key)
                      if (hash(password, u.getString("salt")) != u.getString("hash")) return "Sai mật khẩu"
                  } else {
                      val salt = newSalt()
                      users.put(
                          key,
                          JSONObject().put("name", n).put("salt", salt).put("hash", hash(password, salt))
                      )
                      prefs.edit().putString("users", users.toString()).apply()
                  }
                  prefs.edit().putString("current_user", key).apply()
                  return null
              }

              // ---------- Lịch sử xem ----------
              fun history(user: String): List<HistoryEntry> {
                  val arr = JSONArray(prefs.getString("history_$user", "[]") ?: "[]")
                  return (0 until arr.length()).map { i ->
                      val o = arr.getJSONObject(i)
                      HistoryEntry(
                          o.getString("url"),
                          o.optString("title"),
                          o.optString("uploader"),
                          o.optString("thumb").ifEmpty { null },
                          o.optLong("duration", -1),
                          o.optLong("time")
                      )
                  }
              }

              fun addHistory(user: String, e: HistoryEntry) {
                  val list = (listOf(e) + history(user).filter { it.url != e.url }).take(200)
                  val arr = JSONArray()
                  list.forEach {
                      arr.put(
                          JSONObject()
                              .put("url", it.url)
                              .put("title", it.title)
                              .put("uploader", it.uploader)
                              .put("thumb", it.thumb ?: "")
                              .put("duration", it.duration)
                              .put("time", it.time)
                      )
                  }
                  prefs.edit().putString("history_$user", arr.toString()).apply()
              }

              fun clearHistory(user: String) {
                  prefs.edit().remove("history_$user").apply()
              }

              // ---------- Lịch sử tìm kiếm ----------
              fun searches(user: String): List<String> {
                  val arr = JSONArray(prefs.getString("search_$user", "[]") ?: "[]")
                  return (0 until arr.length()).map { arr.getString(it) }
              }

              fun addSearch(user: String, q: String) {
                  val list = (listOf(q) + searches(user).filter { !it.equals(q, ignoreCase = true) }).take(30)
                  val arr = JSONArray()
                  list.forEach { arr.put(it) }
                  prefs.edit().putString("search_$user", arr.toString()).apply()
              }

              fun clearSearches(user: String) {
                  prefs.edit().remove("search_$user").apply()
              }

              private fun hash(password: String, salt: String): String =
                  MessageDigest.getInstance("SHA-256")
                      .digest((salt + password).toByteArray())
                      .joinToString("") { "%02x".format(it) }

              private fun newSalt(): String {
                  val b = ByteArray(16)
                  SecureRandom().nextBytes(b)
                  return b.joinToString("") { "%02x".format(it) }
              }
          }
