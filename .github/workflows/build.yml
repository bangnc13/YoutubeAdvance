          package com.example.adfreetube

          import android.util.Xml
          import okhttp3.MediaType.Companion.toMediaType
          import okhttp3.OkHttpClient
          import okhttp3.Request
          import okhttp3.RequestBody.Companion.toRequestBody
          import org.json.JSONObject
          import org.xmlpull.v1.XmlPullParser
          import java.io.StringReader
          import java.time.OffsetDateTime

          data class Channel(val id: String, val title: String, val thumb: String?, val subId: String)

          data class FeedVideo(
              val url: String,
              val title: String,
              val author: String,
              val thumb: String,
              val published: Long
          )

          /** YouTube Data API v3 (chính thức): danh sách kênh đăng ký, đăng ký, hủy đăng ký. */
          class YouTubeApi(private val auth: GoogleAuth) {
              private val http = OkHttpClient()
              private val json = "application/json; charset=utf-8".toMediaType()
              private val base = "https://www.googleapis.com/youtube/v3"

              private fun call(method: String, url: String, body: String? = null): JSONObject {
                  val token = auth.accessToken()
                  val requestBody = if (method == "POST") (body ?: "").toRequestBody(json) else null
                  val req = Request.Builder()
                      .url(url)
                      .header("Authorization", "Bearer $token")
                      .method(method, requestBody)
                      .build()
                  http.newCall(req).execute().use { r ->
                      val text = r.body?.string() ?: ""
                      if (!r.isSuccessful) throw IllegalStateException(errorMessage(r.code, text))
                      return if (text.isBlank()) JSONObject() else JSONObject(text)
                  }
              }

              private fun errorMessage(code: Int, text: String): String {
                  val msg = try {
                      JSONObject(text).optJSONObject("error")?.optString("message")
                  } catch (e: Exception) {
                      null
                  }
                  return when {
                      code == 403 && msg?.contains("quota", ignoreCase = true) == true ->
                          "Hết hạn mức YouTube API hôm nay, hãy thử lại sau"
                      !msg.isNullOrBlank() -> msg
                      else -> "Lỗi YouTube API ($code)"
                  }
              }

              fun myChannelName(): String {
                  val j = call("GET", "$base/channels?part=snippet&mine=true")
                  return j.optJSONArray("items")?.optJSONObject(0)
                      ?.optJSONObject("snippet")?.optString("title") ?: ""
              }

              fun subscriptions(): List<Channel> {
                  val out = ArrayList<Channel>()
                  var page: String? = null
                  var n = 0
                  do {
                      val url = "$base/subscriptions?part=snippet&mine=true&maxResults=50&order=alphabetical" +
                          (page?.let { "&pageToken=$it" } ?: "")
                      val j = call("GET", url)
                      val items = j.optJSONArray("items")
                      if (items != null) {
                          for (i in 0 until items.length()) {
                              val o = items.getJSONObject(i)
                              val sn = o.getJSONObject("snippet")
                              out.add(
                                  Channel(
                                      sn.getJSONObject("resourceId").getString("channelId"),
                                      sn.optString("title"),
                                      sn.optJSONObject("thumbnails")?.optJSONObject("default")?.optString("url"),
                                      o.getString("id")
                                  )
                              )
                          }
                      }
                      page = j.optString("nextPageToken").ifEmpty { null }
                      n++
                  } while (page != null && n < 20)
                  return out
              }

              fun subscribe(channelId: String): Channel {
                  val body = JSONObject().put(
                      "snippet",
                      JSONObject().put(
                          "resourceId",
                          JSONObject().put("kind", "youtube#channel").put("channelId", channelId)
                      )
                  ).toString()
                  val j = call("POST", "$base/subscriptions?part=snippet", body)
                  val sn = j.getJSONObject("snippet")
                  return Channel(
                      channelId,
                      sn.optString("title"),
                      sn.optJSONObject("thumbnails")?.optJSONObject("default")?.optString("url"),
                      j.getString("id")
                  )
              }

              fun unsubscribe(subscriptionId: String) {
                  call("DELETE", "$base/subscriptions?id=$subscriptionId")
              }

              /** Video mới của một kênh qua RSS công khai (không tốn hạn mức API). */
              fun channelFeed(channelId: String): List<FeedVideo> {
                  val req = Request.Builder()
                      .url("https://www.youtube.com/feeds/videos.xml?channel_id=$channelId")
                      .header("User-Agent", DownloaderImpl.USER_AGENT)
                      .build()
                  http.newCall(req).execute().use { r ->
                      if (!r.isSuccessful) return emptyList()
                      return parseFeed(r.body?.string() ?: "")
                  }
              }

              private fun parseFeed(xml: String): List<FeedVideo> {
                  val parser = Xml.newPullParser()
                  parser.setInput(StringReader(xml))
                  val list = ArrayList<FeedVideo>()
                  var inEntry = false
                  var tag = ""
                  var id = ""
                  var title = ""
                  var author = ""
                  var published = 0L
                  var ev = parser.eventType
                  while (ev != XmlPullParser.END_DOCUMENT) {
                      when (ev) {
                          XmlPullParser.START_TAG -> {
                              tag = parser.name
                              if (tag == "entry") {
                                  inEntry = true
                                  id = ""
                                  title = ""
                                  published = 0L
                              }
                          }
                          XmlPullParser.TEXT -> {
                              val t = parser.text.trim()
                              if (t.isNotEmpty()) {
                                  when (tag) {
                                      "yt:videoId" -> if (inEntry) id = t
                                      "title" -> if (inEntry && title.isEmpty()) title = t
                                      "published" -> if (inEntry) published = parseDate(t)
                                      "name" -> author = t
                                  }
                              }
                          }
                          XmlPullParser.END_TAG -> {
                              if (parser.name == "entry") {
                                  inEntry = false
                                  if (id.isNotEmpty()) {
                                      list.add(
                                          FeedVideo(
                                              "https://www.youtube.com/watch?v=$id",
                                              title,
                                              author,
                                              "https://i.ytimg.com/vi/$id/hqdefault.jpg",
                                              published
                                          )
                                      )
                                  }
                              }
                              tag = ""
                          }
                      }
                      ev = parser.next()
                  }
                  return list
              }

              private fun parseDate(s: String): Long = try {
                  OffsetDateTime.parse(s).toInstant().toEpochMilli()
              } catch (e: Exception) {
                  0L
              }
          }
